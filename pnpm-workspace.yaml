packages:
  - packages/*
  - playground

# Link the playground to the local package by range
linkWorkspacePackages: true
saveWorkspaceProtocol: false

# Intended to mitigate supply chain attacks; a package must be 48h old to install
minimumReleaseAge: 2880
verifyDepsBeforeRun: error
strictDepBuilds: true

minimumReleaseAgeExclude:
  - '@xsynaptic/*'

# TypeScript 7 native binaries for fallow's type-aware mode, which this project does not use
overrides:
  fallow-type-aware: '-'

packageExtensions:
  # Its 1.x emnapi core crashes on the 2.x beta runtime pnpm otherwise hands it
  '@astrojs/astro2tsx':
    dependencies:
      '@emnapi/runtime': 1.11.3

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-jsx-a11y caps its eslint peer at ^9 but uses no APIs removed in ESLint 10
    'eslint-plugin-jsx-a11y>eslint': '10'

allowBuilds:
  esbuild: true
  lefthook: true

permissions:
  fallow:
    skills: false

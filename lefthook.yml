# Print complete output on failure
output:
  - failure
  - execution_out

# Check-only; a hook that re-stages files sweeps in a concurrent session's edits
pre-commit:
  jobs:
    - name: format
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

pre-push:
  jobs:
    - name: gate
      run: pnpm check
    - name: e2e
      run: pnpm test-e2e

check:
  piped: true
  jobs:
    # Build first because the playground type-checks against the library's `dist` folder
    - name: build
      run: node scripts/quiet.ts pnpm build
    - name: verify
      group:
        parallel: true
        jobs:
          - name: types
            run: node scripts/quiet.ts pnpm check-types
          - name: format
            run: prettier --check . --cache --log-level warn
          - name: lint
            run: eslint --max-warnings 0 --cache --cache-location node_modules/.cache/eslint/
          - name: css
            run: stylelint "{packages/sonic-ui/src,playground/src}/**/*.{css,astro}" --cache --cache-location node_modules/.cache/stylelint/
          - name: unused
            run: knip
          - name: dupes
            run: fallow dupes --quiet
          - name: complexity
            run: node scripts/quiet.ts fallow health --complexity --quiet
          # `fallow health --css` never exits non-zero; audit gates the css-* rules, scoped to changed files
          - name: styling
            run: node scripts/quiet.ts fallow audit --gate all --quiet
          - name: architecture
            run: fallow dead-code --boundary-violations --circular-deps --stale-suppressions --quiet
          - name: test
            run: node scripts/quiet.ts vitest run --passWithNoTests

fix:
  piped: true
  jobs:
    - name: autofix
      group:
        piped: true
        jobs:
          # Stylelint's fixes land before Prettier so they come out formatted
          - name: css
            run: stylelint "{packages/sonic-ui/src,playground/src}/**/*.{css,astro}" --fix --cache --cache-location node_modules/.cache/stylelint/
          - name: format
            run: prettier --write . --cache --list-different
          - name: lint
            run: eslint --fix --cache --cache-location node_modules/.cache/eslint/
    - name: report
      run: pnpm check
